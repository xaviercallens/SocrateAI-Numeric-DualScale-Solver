[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualscale-solver"
version = "0.1.0"
description = "SocrateAI Numeric Dual-Scale Solver: High-Performance Multi-Scale PDE Solvers & Exact Rational Invariant Verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Xavier Callens", email = "xavier.callens@socrate.ai" },
]
keywords = [
    "navier-stokes",
    "dual-scale",
    "pde-solver",
    "dyadic-cascade",
    "pseudo-spectral",
    "t-duality",
    "exact-arithmetic",
    "verification-certificates"
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jsonschema>=4.18.0",
    "datasets>=2.14.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "matplotlib>=3.7.0",
]
# TSK-66: Phase 6 agentic runtime extras (H27: required for CERTIFIED status)
agentic = [
    "google-antigravity>=0.1.0",
]

[project.scripts]
dualscale-solver = "dualscale_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:zarr"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
